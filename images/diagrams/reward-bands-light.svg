<svg xmlns="http://www.w3.org/2000/svg" width="540" height="720" viewBox="0 0 540 720" role="img" aria-labelledby="title desc">
<title id="title">RL task reward and difficulty bands</title>
<desc id="desc">Reward is weighted checks passed divided by weighted total. Behavioral, integration, end-to-end, and runtime checks weigh 4; core and other checks weigh 1; setup, install, typecheck, build, and lint weigh 0. A failed core check scales the score by the share of core checks passed; a synthesized layer, when present, is a fixed 50% of the reward. On a 0 to 1 scale, doing nothing must score 0.1 or less and the reference solution 0.95 or more. Solver scores from 0.1 to 0.8 are deliverable; under 0.1 is too hard and over 0.8 is too easy, each going to a separate tier.</desc>
<style>
text{font-family:Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif}
.m{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace}
.b{font-weight:600}
.cap{letter-spacing:.07em}
.bg{fill:#fafafa;stroke:#e5e5e5}
.n{fill:#ffffff;stroke:#d4d4d4}
.na{fill:#eaf0fc;stroke:#315cbc}
.soft{fill:#f0f0f0}
.fa{fill:#315cbc}
.fsa{fill:#eaf0fc}
.t1{fill:#161616}
.t2{fill:#474747}
.t3{fill:#666666}
.ta{fill:#2b52a8}
.ton{fill:#ffffff}
.ln{fill:none;stroke:#8f8f8f}
.lna{fill:none;stroke:#315cbc}
.hd{fill:#8f8f8f}
.hda{fill:#315cbc}
.rule{fill:none;stroke:#e3e3e3}
</style>
<rect x="0.5" y="0.5" width="539" height="719" rx="12" class="bg"/>
<text x="20" y="34" font-size="13" class="t3 b cap">HOW A RUN IS SCORED</text>
<rect x="20" y="50" width="500" height="58" rx="10" class="soft"/>
<text x="270" y="86" font-size="16" text-anchor="middle"><tspan class="t3">reward = </tspan><tspan class="t1 b">weighted checks passed</tspan><tspan class="t3"> ÷ </tspan><tspan class="t1 b">weighted total</tspan></text>
<rect x="20" y="122" width="46" height="26" rx="13" class="na"/>
<text x="43" y="140" font-size="14" class="ta b" text-anchor="middle">×4</text>
<text x="80" y="140" font-size="15" class="t2">behavioral, integration, end-to-end, runtime</text>
<rect x="20" y="156" width="46" height="26" rx="13" class="n"/>
<text x="43" y="174" font-size="14" class="t2 b" text-anchor="middle">×1</text>
<text x="80" y="174" font-size="15" class="t2">core and all other checks</text>
<rect x="20" y="190" width="46" height="26" rx="13" class="n"/>
<text x="43" y="208" font-size="14" class="t2 b" text-anchor="middle">×0</text>
<text x="80" y="208" font-size="15" class="t2">setup, install, typecheck, build, lint</text>
<circle cx="23" cy="237" r="2.5" class="fa"/>
<text x="34" y="242" font-size="14" class="t2">A failed core check scales the score by the share</text>
<text x="34" y="261" font-size="14" class="t2">of core checks passed.</text>
<circle cx="23" cy="282" r="2.5" class="fa"/>
<text x="34" y="287" font-size="14" class="t2">A synthesized check layer, when present, is a</text>
<text x="34" y="306" font-size="14" class="t2">fixed 50% of the reward.</text>
<circle cx="23" cy="327" r="2.5" class="fa"/>
<text x="34" y="332" font-size="14" class="t2">A run scores 0 if its results file is missing, test</text>
<text x="34" y="351" font-size="14" class="t2">tooling was altered, tracked files are left modified,</text>
<text x="34" y="370" font-size="14" class="t2">or a grading pass runs past the time cap.</text>
<path d="M20 404L520 404" class="rule" stroke-width="1"/>
<text x="20" y="438" font-size="13" class="t3 b cap">WHERE A TASK MUST LAND</text>
<path d="M81.2 486L81.2 534" class="ln" stroke-width="1.5"/>
<circle cx="81.2" cy="484" r="4.5" class="fa"/>
<text x="91.2" y="489" font-size="14" class="t1">doing nothing: 0.1 or less</text>
<path d="M482.4 514L482.4 534" class="ln" stroke-width="1.5"/>
<circle cx="482.4" cy="512" r="4.5" class="fa"/>
<text x="472.4" y="517" font-size="14" class="t1" text-anchor="end">reference: 0.95 or more</text>
<rect x="34" y="536" width="45.2" height="30" rx="6" class="soft"/>
<rect x="81.2" y="536" width="330.4" height="30" rx="6" class="fa"/>
<rect x="413.6" y="536" width="92.4" height="30" rx="6" class="soft"/>
<text x="246.4" y="556" font-size="15" class="ton b" text-anchor="middle">deliverable: 0.1 to 0.8</text>
<text x="459.8" y="556" font-size="14" class="t2" text-anchor="middle">too easy</text>
<path d="M34 574L34 580" class="ln" stroke-width="1"/>
<text x="34" y="596" font-size="13" class="t3 m" text-anchor="middle">0</text>
<path d="M81.2 574L81.2 580" class="ln" stroke-width="1"/>
<text x="81.2" y="596" font-size="13" class="t3 m" text-anchor="middle">0.1</text>
<path d="M270 574L270 580" class="ln" stroke-width="1"/>
<text x="270" y="596" font-size="13" class="t3 m" text-anchor="middle">0.5</text>
<path d="M411.6 574L411.6 580" class="ln" stroke-width="1"/>
<text x="411.6" y="596" font-size="13" class="t3 m" text-anchor="middle">0.8</text>
<path d="M506 574L506 580" class="ln" stroke-width="1"/>
<text x="506" y="596" font-size="13" class="t3 m" text-anchor="middle">1</text>
<text x="57.6" y="618" font-size="14" class="t2">too hard</text>
<path d="M57.6 604L57.6 568" class="ln" stroke-width="1"/>
<text x="20" y="652" font-size="14" class="t3">Solver runs set the band. A task under 0.1 gets one</text>
<text x="20" y="671" font-size="14" class="t3">de-scope round, then goes to a separate hard tier; one</text>
<text x="20" y="690" font-size="14" class="t3">over 0.8 goes to a separate easy tier.</text>
</svg>
