<svg xmlns="http://www.w3.org/2000/svg" width="540" height="486" viewBox="0 0 540 486" role="img" aria-labelledby="title desc">
<title id="title">pre.dev products</title>
<desc id="desc">Five products and how to reach them. Coding Agent: web and CLI; returns pull requests and published apps. Architect: API and MCP; returns Markdown and JSON specs. Browser Agents: API and MCP; returns results and an event timeline. AI Gateway: API; returns OpenAI-compatible model responses. Payments and sign-in: built into apps made in the web workspace; provides Checkout, payouts, and user accounts.</desc>
