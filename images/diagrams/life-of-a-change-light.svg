<svg xmlns="http://www.w3.org/2000/svg" width="540" height="510" viewBox="0 0 540 510" role="img" aria-labelledby="title desc">
<title id="title">Life of a change</title>
<desc id="desc">Five steps. You describe the change in the web workspace or CLI. The agent picks an approach: answer, edit directly, or plan first. It builds on the session branch. An independent judge scores each acceptance criterion from the recorded run, and unproven work is fixed and resubmitted. You review the diff, checks, and preview, then merge through a GitHub pull request or publish the app.</desc>
<style>
text{font-family:Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif}
.m{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace}
.b{font-weight:600}
.cap{letter-spacing:.07em}
.bg{fill:#fafafa;stroke:#e5e5e5}
.n{fill:#ffffff;stroke:#d4d4d4}
.na{fill:#eaf0fc;stroke:#315cbc}
.soft{fill:#f0f0f0}
.fa{fill:#315cbc}
.fsa{fill:#eaf0fc}
.t1{fill:#161616}
.t2{fill:#474747}
.t3{fill:#666666}
.ta{fill:#2b52a8}
.ton{fill:#ffffff}
.ln{fill:none;stroke:#8f8f8f}
.lna{fill:none;stroke:#315cbc}
.hd{fill:#8f8f8f}
.hda{fill:#315cbc}
.rule{fill:none;stroke:#e3e3e3}
</style>
<rect x="0.5" y="0.5" width="539" height="509" rx="12" class="bg"/>
<path d="M42 40L42 384" class="rule" stroke-width="2"/>
<path d="M30 298L18 298L18 212L23 212" class="lna" stroke-width="1.5" stroke-linejoin="round"/><path d="M29 212L22 215.9L22 208.2Z" class="hda"/>
<circle cx="42" cy="40" r="12" class="n"/><text x="42" y="44.6" font-size="13" class="t2 b" text-anchor="middle">1</text>
<text x="70" y="46" font-size="17" class="t1 b">Describe the change</text>
<text x="70" y="69" font-size="15" class="t2">In the web workspace or the CLI: the behavior</text>
<text x="70" y="89" font-size="15" class="t2">you want, the context, and the constraints.</text>
<circle cx="42" cy="126" r="12" class="fa"/><text x="42" y="130.6" font-size="13" class="ton b" text-anchor="middle">2</text>
<text x="70" y="132" font-size="17" class="t1 b">The agent picks an approach</text>
<text x="70" y="155" font-size="15" class="t2">It answers, edits the code directly, or plans</text>
<text x="70" y="175" font-size="15" class="t2">first, with a plan you can review.</text>
<circle cx="42" cy="212" r="12" class="fa"/><text x="42" y="216.6" font-size="13" class="ton b" text-anchor="middle">3</text>
<text x="70" y="218" font-size="17" class="t1 b">It builds on the session branch</text>
<text x="70" y="241" font-size="15" class="t2">Every session has its own branch. Sprints set</text>
<text x="70" y="261" font-size="15" class="t2">the scope of the work; effort sets its depth.</text>
<circle cx="42" cy="298" r="12" class="fa"/><text x="42" y="302.6" font-size="13" class="ton b" text-anchor="middle">4</text>
<text x="70" y="304" font-size="17" class="t1 b">It verifies the work</text>
<text x="70" y="327" font-size="15" class="t2">An independent judge scores each acceptance criterion</text>
<text x="70" y="347" font-size="15" class="t2">from the recorded run, then unproven work is fixed.</text>
<circle cx="42" cy="384" r="12" class="n"/><text x="42" y="388.6" font-size="13" class="t2 b" text-anchor="middle">5</text>
<text x="70" y="390" font-size="17" class="t1 b">You review and ship</text>
<text x="70" y="413" font-size="15" class="t2">Read the diff, the checks, and the preview. Merge</text>
<text x="70" y="433" font-size="15" class="t2">through a GitHub pull request, or publish the app.</text>
<path d="M20 460L520 460" class="rule" stroke-width="1"/>
<circle cx="27" cy="481" r="7" class="n"/>
<text x="42" y="486" font-size="14" class="t2">You</text>
<circle cx="92" cy="481" r="7" class="fa"/>
<text x="107" y="486" font-size="14" class="t2">The agent</text>
<path d="M195 481L219 481" class="lna" stroke-width="1.5" stroke-linejoin="round"/><path d="M225 481L218 484.9L218 477.2Z" class="hda"/>
<text x="233" y="486" font-size="14" class="t2">Unproven criteria go back to the build</text>
</svg>
