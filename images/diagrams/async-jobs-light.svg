<svg xmlns="http://www.w3.org/2000/svg" width="540" height="640" viewBox="0 0 540 640" role="img" aria-labelledby="title desc">
<title id="title">Async jobs on the pre.dev API</title>
<desc id="desc">Specs, browser runs, and video jobs follow one pattern. Submit the job: POST /fast-spec or /deep-spec with async true, POST /browser-agent with async true, or POST /v1/videos. Save the ID it returns: specId, or id. Poll it or stream it: GET /spec-status/{specId}, GET /browser-agent/{id} or its /stream, GET /v1/videos/{jobId}. Stop at a terminal status: completed specs carry Markdown, JSON, and graphs; a completed browser run carries each task status; a completed video downloads from /content. A failed status also ends the job.</desc>
<style>
text{font-family:Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif}
.m{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace}
.b{font-weight:600}
.cap{letter-spacing:.07em}
.bg{fill:#fafafa;stroke:#e5e5e5}
.n{fill:#ffffff;stroke:#d4d4d4}
.na{fill:#eaf0fc;stroke:#315cbc}
.soft{fill:#f0f0f0}
.fa{fill:#315cbc}
.fsa{fill:#eaf0fc}
.t1{fill:#161616}
.t2{fill:#474747}
.t3{fill:#666666}
.ta{fill:#2b52a8}
.ton{fill:#ffffff}
.ln{fill:none;stroke:#8f8f8f}
.lna{fill:none;stroke:#315cbc}
.hd{fill:#8f8f8f}
.hda{fill:#315cbc}
.rule{fill:none;stroke:#e3e3e3}
</style>
<rect x="0.5" y="0.5" width="539" height="639" rx="12" class="bg"/>
<rect x="20" y="20" width="500" height="124" rx="10" class="n"/>
<circle cx="44" cy="46" r="12" class="n"/><text x="44" y="50.6" font-size="13" class="t2 b" text-anchor="middle">1</text>
<text x="66" y="52" font-size="17" class="t1 b">Submit the job</text>
<text x="66" y="82" font-size="14" class="t3">Specs</text>
<text x="150" y="82" font-size="14"><tspan class="t1 m">POST /fast-spec</tspan><tspan class="t2"> or </tspan><tspan class="t1 m">/deep-spec</tspan></text>
<text x="506" y="82" font-size="13" class="t3 m" text-anchor="end">async: true</text>
<text x="66" y="106" font-size="14" class="t3">Browser</text>
<text x="150" y="106" font-size="14"><tspan class="t1 m">POST /browser-agent</tspan></text>
<text x="506" y="106" font-size="13" class="t3 m" text-anchor="end">async: true</text>
<text x="66" y="130" font-size="14" class="t3">Video</text>
<text x="150" y="130" font-size="14"><tspan class="t1 m">POST /v1/videos</tspan></text>
<path d="M270 146L270 162" class="ln" stroke-width="1.5" stroke-linejoin="round"/><path d="M270 168L266.2 161L273.9 161Z" class="hd"/>
<rect x="20" y="170" width="500" height="124" rx="10" class="n"/>
<circle cx="44" cy="196" r="12" class="n"/><text x="44" y="200.6" font-size="13" class="t2 b" text-anchor="middle">2</text>
<text x="66" y="202" font-size="17" class="t1 b">Save the ID it returns</text>
<text x="66" y="232" font-size="14" class="t3">Specs</text>
<text x="150" y="232" font-size="14"><tspan class="t1 m">specId</tspan></text>
<text x="506" y="232" font-size="13" class="t3 m" text-anchor="end">status: pending</text>
<text x="66" y="256" font-size="14" class="t3">Browser</text>
<text x="150" y="256" font-size="14"><tspan class="t1 m">id</tspan></text>
<text x="506" y="256" font-size="13" class="t3 m" text-anchor="end">status: processing</text>
<text x="66" y="280" font-size="14" class="t3">Video</text>
<text x="150" y="280" font-size="14"><tspan class="t1 m">id</tspan></text>
<path d="M270 296L270 312" class="ln" stroke-width="1.5" stroke-linejoin="round"/><path d="M270 318L266.2 311L273.9 311Z" class="hd"/>
<rect x="20" y="320" width="500" height="124" rx="10" class="n"/>
<circle cx="44" cy="346" r="12" class="n"/><text x="44" y="350.6" font-size="13" class="t2 b" text-anchor="middle">3</text>
<text x="66" y="352" font-size="17" class="t1 b">Poll it, or stream it</text>
<text x="66" y="382" font-size="14" class="t3">Specs</text>
<text x="150" y="382" font-size="14"><tspan class="t1 m">GET /spec-status/{specId}</tspan></text>
<text x="66" y="406" font-size="14" class="t3">Browser</text>
<text x="150" y="406" font-size="14"><tspan class="t1 m">GET /browser-agent/{id}</tspan></text>
<text x="506" y="406" font-size="13" class="t3 m" text-anchor="end">or /{id}/stream</text>
<text x="66" y="430" font-size="14" class="t3">Video</text>
<text x="150" y="430" font-size="14"><tspan class="t1 m">GET /v1/videos/{jobId}</tspan></text>
<path d="M270 446L270 462" class="ln" stroke-width="1.5" stroke-linejoin="round"/><path d="M270 468L266.2 461L273.9 461Z" class="hd"/>
<rect x="20" y="470" width="500" height="150" rx="10" class="na"/>
<circle cx="44" cy="496" r="12" class="fa"/><text x="44" y="500.6" font-size="13" class="ton b" text-anchor="middle">4</text>
<text x="66" y="502" font-size="17" class="t1 b">Stop at a terminal status, then read</text>
<text x="66" y="532" font-size="14" class="t3">Specs</text>
<text x="150" y="532" font-size="14"><tspan class="t1 m">completed</tspan><tspan class="t2"> → Markdown, JSON, graphs</tspan></text>
<text x="66" y="556" font-size="14" class="t3">Browser</text>
<text x="150" y="556" font-size="14"><tspan class="t1 m">completed</tspan><tspan class="t2"> → each task’s </tspan><tspan class="t1 m">status</tspan></text>
<text x="66" y="580" font-size="14" class="t3">Video</text>
<text x="150" y="580" font-size="14"><tspan class="t1 m">completed</tspan><tspan class="t2"> → </tspan><tspan class="t1 m">GET …/{jobId}/content</tspan></text>
<text x="66" y="610" font-size="14"><tspan class="t1 m">failed</tspan><tspan class="t2"> also ends the job.</tspan></text>
</svg>
