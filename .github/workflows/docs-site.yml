name: Docs site

# Builds the self-hosted docs site (site/) on every PR and deploys it to
# Cloudflare Workers from main. PRs from this repository get a preview URL.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: deps
        uses: actions/cache@v4
        with:
          path: site/node_modules
          key: docs-site-deps-${{ runner.os }}-node22-${{ hashFiles('site/package-lock.json') }}
      - if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      - name: Type-check the worker
        run: npm run check:worker
      - name: Check the build output
        run: npm run check:out
      # Deploy and preview steps run once the Cloudflare secrets are set on the repo.
      - name: Deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
      - name: Upload preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler versions upload --preview-alias "pr-${{ github.event.number }}" --message "PR #${{ github.event.number }}"
