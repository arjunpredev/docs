name: Docs site

# Builds the self-hosted docs site (site/) on every PR and push, and deploys it
# to Cloudflare Workers from main. The Cloudflare credentials live in the
# "production" environment, which only main can use, so no PR job sees them.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
        with:
          # full history: page dates in the sitemap and structured data come from git
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: deps
        uses: actions/cache@v4
        with:
          path: site/node_modules
          key: docs-site-deps-${{ runner.os }}-node22-${{ hashFiles('site/package-lock.json') }}
      - if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      - name: Type-check the worker
        run: npm run check:worker
      - name: Check the build output
        run: npm run check:out
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: site-out
          path: site/out
          include-hidden-files: true
          retention-days: 3

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: docs-site-deploy
      cancel-in-progress: false
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: deps
        uses: actions/cache@v4
        with:
          path: site/node_modules
          key: docs-site-deps-${{ runner.os }}-node22-${{ hashFiles('site/package-lock.json') }}
      - if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: site-out
          path: site/out
      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
