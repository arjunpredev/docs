name: Docs CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # `npm ci` was 26 s of a ~60 s job, and `mint validate` then fetched the
      # 358 MB Mintlify client into ~/.mintlify on every run (9 s cold, 3 s
      # warm). Cache both, keyed on the lockfile. On a miss, drop the Claude Agent
      # SDK and Codex binaries (@mintlify/cli optional deps, 620 MB, used only
      # by mint's AI commands, never by these checks) so the cache stays ~160 MB.
      - id: deps
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.mintlify
          key: docs-deps-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - if: steps.deps.outputs.cache-hit != 'true'
        run: |
          npm ci --no-audit --no-fund
          rm -rf node_modules/@anthropic-ai node_modules/@openai
      - name: Validate schemas, examples, navigation, and redirects
        run: npm run check
      - name: Compile and exercise Node guide examples with mocked HTTP
        run: npm run check:node
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the documented Python SDK
        run: python -m pip install predev-api==1.1.0
      - name: Exercise Python guide examples with mocked HTTP
        run: npm run check:python
      - name: Validate the Mintlify build
        run: npm run validate
      - name: Check links, anchors, and redirects
        run: npm run links
      - name: Check accessibility
        run: npm run a11y
      - name: Guard against fictional packages
        run: |
          ! grep -rn "@predev/sdk\|pip install predev[^-]\|@predotdev/mcp-server" --include="*.mdx" --exclude-dir=node_modules . || (echo "Unknown SDK or MCP package in docs" && exit 1)
      - name: Guard against internal infrastructure disclosures
        run: |
          ! grep -rni "supertokens\|daytona\|e2b\|kubernetes ingress" --include="*.mdx" --exclude-dir=node_modules . || (echo "Internal infrastructure mentioned in public docs" && exit 1)
